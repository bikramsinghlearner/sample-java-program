<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-tasks"></i> Task Manager</h1>
            <p class="subtitle">Stay organized and productive</p>
        </header>

        <div class="task-form-container">
            <form th:action="@{/tasks}" method="post" th:object="${newTask}" class="task-form">
                <div class="form-group">
                    <input type="text" th:field="*{title}" placeholder="Enter task title..." class="form-input" required>
                </div>
                <div class="form-group">
                    <textarea th:field="*{description}" placeholder="Enter task description..." class="form-textarea" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Add Task
                </button>
            </form>
        </div>

        <div class="tasks-container">
            <div th:if="${#lists.isEmpty(tasks)}" class="empty-state">
                <i class="fas fa-clipboard-list"></i>
                <h3>No tasks yet</h3>
                <p>Create your first task to get started!</p>
            </div>

            <div th:unless="${#lists.isEmpty(tasks)}" class="tasks-grid">
                <div th:each="task : ${tasks}" class="task-card" th:classappend="${task.completed} ? 'completed' : ''">
                    <div class="task-header">
                        <h3 class="task-title" th:text="${task.title}">Task Title</h3>
                        <div class="task-actions">
                            <form th:action="@{/tasks/{id}/toggle(id=${task.id})}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-toggle" th:title="${task.completed} ? 'Mark as pending' : 'Mark as completed'">
                                    <i th:class="${task.completed} ? 'fas fa-undo' : 'fas fa-check'"></i>
                                </button>
                            </form>
                            <form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-danger" title="Delete task" onclick="return confirm('Are you sure you want to delete this task?')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                    
                    <p class="task-description" th:text="${task.description}" th:if="${!#strings.isEmpty(task.description)}">Task Description</p>
                    
                    <div class="task-meta">
                        <span class="task-status" th:classappend="${task.completed} ? 'status-completed' : 'status-pending'">
                            <i th:class="${task.completed} ? 'fas fa-check-circle' : 'fas fa-clock'"></i>
                            <span th:text="${task.completed} ? 'Completed' : 'Pending'">Status</span>
                        </span>
                        <span class="task-date" th:text="${#temporals.format(task.createdAt, 'MMM dd, yyyy HH:mm')}">Date</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Add some basic interactivity
        document.addEventListener('DOMContentLoaded', function() {
            const taskCards = document.querySelectorAll('.task-card');
            
            taskCards.forEach(card => {
                card.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-2px)';
                });
                
                card.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0)';
                });
            });
        });
    </script>
</body>
</html>
